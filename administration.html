<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - GIBSYSNET</title>
    <link href="assets/css/output.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/administration.css">
</head>
<body class="bg-gray-50">
    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-gray-700">Memuat data...</p>
        </div>
    </div>

    <!-- Dashboard Grid Container -->
    <div class="dashboard-grid">
        <!-- Menu Bar -->
        <div class="menu-bar text-white" id="menu-bar-container"></div>
        <div class="status-bar text-white text-sm" id="status-bar-container"></div>
        <div class="sidebar" id="sidebar-container" data-title="User Management" data-icon="fas fa-users-cog" data-type="master"></div>
        <div class="main-content">
            <!-- Page Header -->
            <div class="mb-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">User Management</h1>
                        <p class="text-gray-600">Manage system users, roles, and permissions</p>
                    </div>
                    <button onclick="openAddUserModal()" class="btn-primary flex items-center">
                        <i class="fas fa-plus mr-2"></i>
                        Add New User
                    </button>
                </div>
            </div>

            <!-- Search and Filter -->
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="form-label text-sm">Search</label>
                        <input type="text" id="searchInput" class="form-input" placeholder="Search by name, username, or email">
                    </div>
                    <div>
                        <label class="form-label text-sm">User Level</label>
                        <select id="levelFilter" class="form-input">
                            <option value="">All Levels</option>
                            <option value="super_admin">Super Admin</option>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="broker">Broker</option>
                            <option value="user">User</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label text-sm">Department</label>
                        <input type="text" id="deptFilter" class="form-input" placeholder="Filter by department">
                    </div>
                    <div class="flex items-end">
                        <button onclick="applyFilters()" class="btn-primary w-full">Apply Filters</button>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-6 py-4 border-b flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">System Users</h3>
                    <div class="flex space-x-2">
                        <button onclick="loadUsers()" class="btn-secondary">
                            <i class="fas fa-sync-alt mr-2"></i>Refresh
                        </button>
                        <button onclick="exportUsers()" class="btn-secondary">
                            <i class="fas fa-file-export mr-2"></i>Export
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="min-w-full divide-y divide-gray-200" id="usersTable">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Avatar</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User Info</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role & Dept</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="usersTableBody">
                            <!-- Users will be loaded here -->
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin mr-2"></i> Loading users...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="px-6 py-4 border-t bg-gray-50">
                    <div class="flex justify-between items-center">
                        <div class="text-sm text-gray-700">
                            Showing <span id="showingFrom">0</span> to <span id="showingTo">0</span> of <span id="totalRecords">0</span> users
                        </div>
                        <div class="flex space-x-2" id="paginationControls">
                            <!-- Pagination buttons will be generated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center p-6 border-b">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Add New User</h3>
                <button onclick="closeUserModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form id="userForm" class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- User ID -->
                    <div>
                        <label class="form-label">User ID <span class="text-red-500">*</span></label>
                        <input type="text" id="userIdInput" name="user_id" class="form-input" placeholder="e.g., USR001" required>
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="form-label">Username <span class="text-red-500">*</span></label>
                        <input type="text" id="usernameInput" name="username" class="form-input" placeholder="e.g., john_doe" required>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="form-label">Password <span class="text-red-500">*</span></label>
                        <input type="password" id="passwordInput" name="password_hash" class="form-input" placeholder="Enter password" required>
                    </div>

                    <!-- Full Name -->
                    <div>
                        <label class="form-label">Full Name <span class="text-red-500">*</span></label>
                        <input type="text" id="fullNameInput" name="full_name" class="form-input" placeholder="e.g., John Doe" required>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="form-label">Email <span class="text-red-500">*</span></label>
                        <input type="email" id="emailInput" name="email" class="form-input" placeholder="e.g., john@example.com" required>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label class="form-label">Phone</label>
                        <input type="tel" id="phoneInput" name="phone" class="form-input" placeholder="e.g., +62 812 3456 7890">
                    </div>

                    <!-- User Level -->
                    <div>
                        <label class="form-label">User Level <span class="text-red-500">*</span></label>
                        <select id="userLevelInput" name="user_level" class="form-input" required>
                            <option value="">Select Level</option>
                            <option value="super_admin">Super Admin</option>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="broker">Broker</option>
                            <option value="user">User</option>
                        </select>
                    </div>

                    <!-- Department -->
                    <div>
                        <label class="form-label">Department</label>
                        <input type="text" id="departmentInput" name="department" class="form-input" placeholder="e.g., Sales, IT, Finance">
                    </div>
                </div>

                <!-- Avatar URL -->
                <div>
                    <label class="form-label">Avatar URL</label>
                    <input type="url" id="avatarUrlInput" name="avatar_url" class="form-input" placeholder="https://example.com/avatar.jpg">
                    <p class="text-sm text-gray-500 mt-1">Optional: URL to user's profile picture</p>
                </div>

                <!-- Hidden field for edit mode -->
                <input type="hidden" id="userIdHidden" name="id">

                <!-- Form Actions -->
                <div class="flex justify-end space-x-4 pt-4 border-t">
                    <button type="button" onclick="closeUserModal()" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitBtn">
                        <i class="fas fa-save mr-2"></i>Save User
                    </button>
                </div>
            </form>
        
            <div id="footer-container" class="mt-6"></div>
        </div>
    </div>

    <!-- Load JavaScript Files -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/layout-loader.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/administration.js"></script>
</body>
</html>
